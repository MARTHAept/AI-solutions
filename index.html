<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ИИ-решения — Каталог</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #070b18;
  --surface: rgba(17, 24, 39, 0.72);
  --surface-strong: rgba(12, 18, 34, 0.92);
  --border: rgba(148, 163, 184, 0.25);
  --text: #e2e8f0;
  --text2: #b6c3da;
  --text3: #8b99b4;
  --accent: #60a5fa;
  --accent-strong: #3b82f6;
  --accent-light: rgba(59, 130, 246, 0.18);
  --trainer: #a78bfa;
  --trainer-light: rgba(167, 139, 250, 0.18);
  --assistant: #34d399;
  --assistant-light: rgba(52, 211, 153, 0.16);
  --agent: #f59e0b;
  --agent-light: rgba(245, 158, 11, 0.16);
  --shadow: 0 10px 28px rgba(2, 6, 23, 0.35);
  --shadow-md: 0 24px 48px rgba(2, 6, 23, 0.45);
  --radius: 16px;
}

/* Светлая тема */
body.light {
  --bg: #f0f4ff;
  --surface: rgba(255, 255, 255, 0.85);
  --surface-strong: rgba(255, 255, 255, 0.97);
  --border: rgba(99, 102, 241, 0.15);
  --text: #1e293b;
  --text2: #475569;
  --text3: #94a3b8;
  --accent: #3b82f6;
  --accent-strong: #2563eb;
  --accent-light: rgba(59, 130, 246, 0.1);
  --trainer: #7c3aed;
  --trainer-light: rgba(124, 58, 237, 0.1);
  --assistant: #059669;
  --assistant-light: rgba(5, 150, 105, 0.1);
  --agent: #d97706;
  --agent-light: rgba(217, 119, 6, 0.1);
  --shadow: 0 10px 28px rgba(99, 102, 241, 0.1);
  --shadow-md: 0 24px 48px rgba(99, 102, 241, 0.15);
}

/* Переключатель темы */
.theme-toggle {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 6px 14px;
  font-size: 13px;
  color: var(--text2);
  cursor: pointer;
  font-family: 'Inter', sans-serif;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  gap: 6px;
  backdrop-filter: blur(8px);
}

.theme-toggle:hover { color: var(--text); border-color: var(--accent); }

body.light {
  background:
    radial-gradient(1200px 600px at 10% -10%, rgba(99, 102, 241, 0.08), transparent 60%),
    radial-gradient(1000px 540px at 95% 0%, rgba(167, 139, 250, 0.08), transparent 64%),
    radial-gradient(900px 520px at 50% 120%, rgba(59, 130, 246, 0.06), transparent 70%),
    var(--bg);
}

body.light::before { opacity: 0; }

body {
  background:
    radial-gradient(1200px 600px at 10% -10%, rgba(56, 189, 248, 0.2), transparent 60%),
    radial-gradient(1000px 540px at 95% 0%, rgba(167, 139, 250, 0.2), transparent 64%),
    radial-gradient(900px 520px at 50% 120%, rgba(59, 130, 246, 0.22), transparent 70%),
    var(--bg);
  color: var(--text);
  font-family: 'Inter', sans-serif;
  font-size: 14px;
  line-height: 1.6;
  min-height: 100vh;
  position: relative;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  pointer-events: none;
  background-image:
    radial-gradient(circle at 15% 20%, rgba(255, 255, 255, 0.22) 0 1px, transparent 2px),
    radial-gradient(circle at 70% 35%, rgba(255, 255, 255, 0.16) 0 1px, transparent 2px),
    radial-gradient(circle at 35% 70%, rgba(255, 255, 255, 0.12) 0 1px, transparent 2px),
    radial-gradient(circle at 85% 75%, rgba(255, 255, 255, 0.2) 0 1px, transparent 2px);
  background-size: 380px 380px, 460px 460px, 320px 320px, 520px 520px;
  opacity: 0.6;
  z-index: -1;
}

/* ── Header ── */
.header {
  background: linear-gradient(145deg, rgba(17, 24, 39, 0.85), rgba(15, 23, 42, 0.68));
  border-bottom: 1px solid rgba(148, 163, 184, 0.22);
  padding: 20px 32px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 50;
  backdrop-filter: blur(16px);
  box-shadow: 0 10px 30px rgba(2, 6, 23, 0.35);
}

body.light .header {
  background: rgba(255, 255, 255, 0.9);
  border-bottom: 1px solid rgba(99, 102, 241, 0.12);
  box-shadow: 0 4px 20px rgba(99, 102, 241, 0.08);
}

body.light .chat-panel {
  background: rgba(255, 255, 255, 0.85);
  border-bottom: 1px solid rgba(99, 102, 241, 0.1);
}

body.light .chat-input {
  background: rgba(240, 244, 255, 0.8);
  border-color: rgba(99, 102, 241, 0.2);
  color: var(--text);
}

body.light .chat-input:focus {
  background: white;
  border-color: var(--accent);
}

body.light .card {
  background: rgba(255, 255, 255, 0.9);
  border-color: rgba(99, 102, 241, 0.12);
}

body.light .modal {
  background: white;
  border: 1px solid rgba(99, 102, 241, 0.15);
}

body.light .modal-close {
  background: #f1f5f9;
}

body.light .filters {
  background: rgba(240, 244, 255, 0.7);
}

body.light .filter-btn {
  background: white;
  border-color: rgba(99, 102, 241, 0.15);
}

body.light .search-wrap input {
  background: white;
  border-color: rgba(99, 102, 241, 0.15);
}

body.light .chat-label { color: var(--accent); }
body.light .chat-label::before { background: var(--accent); }

body.light .chat-msg.ai .chat-avatar {
  background: #f1f5f9;
  border-color: #e2e8f0;
  color: var(--text2);
}

body.light .chat-msg.ai .chat-bubble {
  background: #f1f5f9;
  border-color: #e2e8f0;
  color: var(--text);
}

body.light .chat-meta .found-badge { background: var(--accent); }

body.light .reset-btn {
  border-color: #e2e8f0;
  color: var(--text2);
}

body.light .filter-label { color: var(--text2); }

body.light .filter-btn {
  background: white;
  border-color: #e2e8f0;
  color: var(--text2);
}

body.light .filter-btn:hover { border-color: var(--accent); color: var(--accent); }
body.light .filter-btn.active { background: var(--accent); border-color: var(--accent); color: white; }
body.light .filter-btn.cat-trainer.active { background: var(--trainer); border-color: var(--trainer); }
body.light .filter-btn.cat-assistant.active { background: var(--assistant); border-color: var(--assistant); }
body.light .filter-btn.cat-agent.active { background: var(--agent); border-color: var(--agent); }

body.light .search-wrap input { background: white; border-color: #e2e8f0; color: var(--text); }
body.light .search-icon { color: var(--text3); }

body.light .grid-title { color: var(--text); }
body.light .grid-count { color: var(--text2); }

body.light .card { background: white; border-color: #e8ecf4; }
body.light .card:hover { border-color: #c7d2fe; }
body.light .card-name { color: var(--text); }
body.light .card-desc { color: var(--text2); }
body.light .card-effect { color: var(--text2); }
body.light .card-provider { color: var(--text3); }

body.light .card-ai-note {
  background: rgba(59, 130, 246, 0.08);
  color: #1e40af;
  border-left-color: var(--accent);
}

body.light .modal { background: white; border-color: #e8ecf4; }
body.light .modal-title { color: var(--text); }
body.light .modal-key { color: var(--text3); }
body.light .modal-val { color: var(--text); }
body.light .modal-row { border-bottom-color: #f1f5f9; }
body.light .modal-close { background: #f1f5f9; color: var(--text2); }
body.light .modal-close:hover { background: #e2e8f0; }

body.light .overlay { background: rgba(15, 23, 42, 0.3); }

body.light .empty { color: var(--text2); }

body.light .card.highlighted {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.12);
}

.logo {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 20px;
  font-weight: 700;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 10px;
}

.logo-icon {
  width: 32px; height: 32px;
  background: linear-gradient(135deg, #38bdf8 0%, #6366f1 55%, #a855f7 100%);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  color: white; font-size: 16px;
  box-shadow: 0 8px 22px rgba(56, 189, 248, 0.45);
}

.header-stats {
  display: flex;
  gap: 24px;
  font-size: 13px;
  color: var(--text2);
}

.header-stat strong {
  color: var(--text);
  font-weight: 600;
}

/* ── AI Chat Panel ── */
.chat-panel {
  background: linear-gradient(145deg, rgba(15, 23, 42, 0.9), rgba(15, 23, 42, 0.68));
  border-bottom: 1px solid rgba(148, 163, 184, 0.18);
  padding: 20px 32px;
  backdrop-filter: blur(14px);
}

.chat-label {
  font-size: 12px;
  font-weight: 600;
  color: #93c5fd;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.chat-label::before {
  content: '';
  width: 6px; height: 6px;
  background: #93c5fd;
  border-radius: 50%;
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

.chat-row {
  display: flex;
  gap: 12px;
  align-items: flex-start;
}

.chat-input {
  flex: 1;
  border: 1.5px solid rgba(148, 163, 184, 0.3);
  border-radius: var(--radius);
  padding: 12px 16px;
  font-family: 'Inter', sans-serif;
  font-size: 14px;
  color: var(--text);
  background: rgba(15, 23, 42, 0.58);
  outline: none;
  resize: none;
  height: 48px;
  transition: border-color 0.2s, height 0.2s, box-shadow 0.2s, background 0.2s;
  line-height: 1.5;
}

.chat-input:focus {
  border-color: #93c5fd;
  height: 80px;
  background: rgba(15, 23, 42, 0.9);
  box-shadow: 0 0 0 4px rgba(96, 165, 250, 0.16);
}

.chat-input::placeholder { color: var(--text3); }

.chat-btn {
  background: linear-gradient(135deg, #38bdf8 0%, #3b82f6 45%, #6366f1 100%);
  color: white;
  border: none;
  border-radius: var(--radius);
  padding: 12px 24px;
  font-family: 'Inter', sans-serif;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
  transition: transform 0.2s, box-shadow 0.2s, filter 0.2s;
  height: 48px;
  box-shadow: 0 10px 24px rgba(37, 99, 235, 0.35);
}

.chat-btn:hover {
  transform: translateY(-1px);
  box-shadow: 0 14px 30px rgba(59, 130, 246, 0.45);
  filter: brightness(1.06);
}
.chat-btn:active { transform: translateY(0); }
.chat-btn:disabled { opacity: 0.5; cursor: not-allowed; }

.chat-history {
  max-height: 300px;
  overflow-y: auto;
  margin-bottom: 12px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.chat-msg {
  display: flex;
  gap: 10px;
  align-items: flex-start;
}

.chat-msg.user { flex-direction: row-reverse; }

.chat-avatar {
  width: 28px; height: 28px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px;
  font-weight: 600;
  flex-shrink: 0;
}

.chat-msg.user .chat-avatar { background: var(--accent); color: white; }
.chat-msg.ai .chat-avatar { background: var(--bg); border: 1px solid var(--border); color: var(--text2); }

.chat-bubble {
  max-width: 80%;
  padding: 10px 14px;
  border-radius: 14px;
  font-size: 14px;
  line-height: 1.6;
}

.chat-msg.user .chat-bubble {
  background: linear-gradient(140deg, #2563eb 0%, #4f46e5 100%);
  color: white;
  border-bottom-right-radius: 4px;
  box-shadow: 0 10px 24px rgba(37, 99, 235, 0.35);
}

.chat-msg.ai .chat-bubble {
  background: rgba(15, 23, 42, 0.75);
  border: 1px solid rgba(148, 163, 184, 0.28);
  color: var(--text);
  border-bottom-left-radius: 4px;
}

.chat-response {
  display: none;
}

.chat-meta {
  display: none;
  align-items: center;
  gap: 12px;
  margin-top: 10px;
}

.chat-meta.visible { display: flex; }

.found-badge {
  background: linear-gradient(135deg, #2563eb, #4f46e5);
  color: white;
  border-radius: 20px;
  padding: 4px 12px;
  font-size: 12px;
  font-weight: 600;
}

.reset-btn {
  background: none;
  border: 1px solid rgba(148, 163, 184, 0.38);
  border-radius: 20px;
  padding: 4px 12px;
  font-size: 12px;
  color: var(--text2);
  cursor: pointer;
  transition: all 0.15s;
}

.reset-btn:hover { border-color: var(--text2); color: var(--text); }

/* Loading dots */
.loading { display: inline-flex; gap: 4px; align-items: center; }
.dot { width: 6px; height: 6px; background: var(--accent); border-radius: 50%; animation: bounce 1.2s infinite; }
.dot:nth-child(2) { animation-delay: 0.2s; }
.dot:nth-child(3) { animation-delay: 0.4s; }
@keyframes bounce { 0%,80%,100%{transform:translateY(0);opacity:0.3} 40%{transform:translateY(-4px);opacity:1} }

/* ── Filters ── */
.filters {
  padding: 16px 32px;
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
  background: linear-gradient(180deg, rgba(15, 23, 42, 0.72), rgba(15, 23, 42, 0.54));
  border-bottom: 1px solid rgba(148, 163, 184, 0.16);
  backdrop-filter: blur(10px);
}

.filter-label {
  font-size: 12px;
  color: var(--text2);
  margin-right: 4px;
}

.filter-btn {
  background: rgba(15, 23, 42, 0.62);
  border: 1px solid rgba(148, 163, 184, 0.26);
  border-radius: 20px;
  padding: 6px 14px;
  font-size: 13px;
  color: var(--text2);
  cursor: pointer;
  transition: all 0.2s;
  font-family: 'Inter', sans-serif;
}

.filter-btn:hover {
  border-color: #93c5fd;
  color: #bfdbfe;
  transform: translateY(-1px);
}
.filter-btn.active {
  background: linear-gradient(135deg, #2563eb, #4f46e5);
  border-color: transparent;
  color: white;
}
.filter-btn.cat-trainer.active { background: var(--trainer); border-color: var(--trainer); }
.filter-btn.cat-assistant.active { background: var(--assistant); border-color: var(--assistant); }
.filter-btn.cat-agent.active { background: var(--agent); border-color: var(--agent); }

.search-wrap {
  margin-left: auto;
  position: relative;
}

.search-wrap input {
  background: rgba(15, 23, 42, 0.62);
  border: 1px solid rgba(148, 163, 184, 0.26);
  border-radius: 20px;
  padding: 6px 14px 6px 34px;
  font-size: 13px;
  color: var(--text);
  font-family: 'Inter', sans-serif;
  outline: none;
  width: 220px;
  transition: border-color 0.2s;
}

.search-wrap input:focus {
  border-color: #93c5fd;
  box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.15);
}
.search-wrap input::placeholder { color: var(--text3); }

.search-icon {
  position: absolute;
  left: 12px; top: 50%;
  transform: translateY(-50%);
  color: var(--text3);
  font-size: 13px;
}

/* ── Grid ── */
.main {
  padding: 24px 32px;
}

.grid-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}

.grid-title {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 16px;
  font-weight: 700;
  color: var(--text);
}

.grid-count {
  font-size: 13px;
  color: var(--text2);
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 16px;
}

/* ── Card ── */
.card {
  background: linear-gradient(155deg, rgba(30, 41, 59, 0.7), rgba(15, 23, 42, 0.9));
  border: 1px solid rgba(148, 163, 184, 0.26);
  border-radius: var(--radius);
  padding: 20px;
  box-shadow: var(--shadow);
  transition: transform 0.24s ease, box-shadow 0.24s ease, border-color 0.24s ease;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  backdrop-filter: blur(12px);
}

.card:hover {
  box-shadow: var(--shadow-md);
  transform: translateY(-4px);
  border-color: rgba(147, 197, 253, 0.55);
}

.card.highlighted {
  border-color: #93c5fd;
  box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.18), var(--shadow-md);
}

.card.dimmed {
  opacity: 0.35;
  transform: none;
}

.card.highlighted::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 4px;
  background: linear-gradient(90deg, #38bdf8, #818cf8, #34d399);
}

.card-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 12px;
  gap: 8px;
}

.card-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 10px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.3px;
  white-space: nowrap;
}

.badge-trainer { background: var(--trainer-light); color: var(--trainer); }
.badge-assistant { background: var(--assistant-light); color: var(--assistant); }
.badge-agent { background: var(--agent-light); color: var(--agent); }

.card-provider {
  font-size: 11px;
  color: var(--text3);
  white-space: nowrap;
}

.card-name {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 15px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 8px;
  line-height: 1.3;
}

.card-desc {
  font-size: 13px;
  color: var(--text2);
  line-height: 1.6;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.card-effect {
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px solid rgba(148, 163, 184, 0.2);
  font-size: 12px;
  color: var(--text2);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.card-effect::before {
  content: '→ ';
  color: var(--assistant);
  font-weight: 600;
}

/* AI explanation on card */
.card-ai-note {
  margin-top: 12px;
  padding: 10px 12px;
  background: rgba(59, 130, 246, 0.16);
  border-radius: 8px;
  font-size: 12px;
  color: #bfdbfe;
  line-height: 1.5;
  display: none;
  border-left: 3px solid #60a5fa;
}

.card-ai-note.visible { display: block; }

/* Empty state */
.empty {
  grid-column: 1/-1;
  text-align: center;
  padding: 60px 20px;
  color: var(--text2);
}

.empty-icon { font-size: 40px; margin-bottom: 12px; }
.empty-text { font-size: 15px; }

/* ── Detail modal ── */
.overlay {
  position: fixed; inset: 0;
  background: rgba(2, 6, 23, 0.55);
  z-index: 100;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 24px;
  backdrop-filter: blur(4px);
}

.overlay.visible { display: flex; }

.modal {
  background: linear-gradient(160deg, rgba(17, 24, 39, 0.95), rgba(15, 23, 42, 0.93));
  border-radius: 16px;
  width: min(560px, 100%);
  max-height: 80vh;
  overflow-y: auto;
  padding: 32px;
  box-shadow: 0 24px 64px rgba(2, 6, 23, 0.52);
  border: 1px solid rgba(148, 163, 184, 0.24);
  animation: modalIn 0.2s ease;
}

@keyframes modalIn { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }

.modal-close {
  float: right;
  background: rgba(30, 41, 59, 0.85);
  border: none;
  border-radius: 8px;
  padding: 6px 12px;
  font-size: 13px;
  color: var(--text2);
  cursor: pointer;
  transition: all 0.15s;
}

.modal-close:hover { background: var(--border); color: var(--text); }

.modal-badge { margin-bottom: 12px; clear: both; display: inline-block; }

.modal-title {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 22px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 20px;
  line-height: 1.3;
}

.modal-row {
  margin-bottom: 16px;
  padding-bottom: 16px;
  border-bottom: 1px solid rgba(148, 163, 184, 0.2);
}

.modal-row:last-child { border-bottom: none; margin-bottom: 0; }

.modal-key {
  font-size: 11px;
  font-weight: 600;
  color: var(--text3);
  letter-spacing: 1px;
  text-transform: uppercase;
  margin-bottom: 4px;
}

.modal-val {
  font-size: 14px;
  color: var(--text);
  line-height: 1.6;
}

:focus-visible {
  outline: 2px solid #93c5fd;
  outline-offset: 2px;
}

@media (max-width: 860px) {
  .header,
  .chat-panel,
  .filters,
  .main {
    padding-left: 16px;

  chatHistory.push({ role, content: text });

  const isUser = role === 'user';
  const msg = document.createElement('div');
  msg.className = `chat-msg ${isUser ? 'user' : 'ai'}`;

    <div class="chat-bubble">${text.replace(/\n/g, '<br>')}</div>
  `;
  history.appendChild(msg);
  history.scrollTop = history.scrollHeight;
}

    const note = aiNotes[s.id] || '';

    return `<div class="card ${isFound ? 'highlighted' : ''}"
      style="${isHidden ? 'display:none' : ''}"
      onclick="showDetail('${s.id}')">
      <div class="card-top">
        <span class="card-badge badge-${s.category}">${s.category_label}</span>
        <span class="card-provider">${s.provider}</span>
      </div>
      <div class="card-name">${s.name}</div>
      ${s.description ? `<div class="card-desc">${s.description}</div>` : ''}
      ${s.effect ? `<div class="card-effect">${s.effect}</div>` : ''}
      ${note ? `<div class="card-ai-note visible">💡 ${note}</div>` : ''}
    </div>`;
  }).join('');
}

// ── AI ───────────────────────────────────────────────────────────
async function askAI() {
  const input = document.getElementById('chat-input').value.trim();
  if (!input) return;

  const btn = document.getElementById('chat-btn');
  btn.disabled = true;

  addMessage('user', input);
  document.getElementById('chat-input').value = '';
  addLoadingMessage();

  const context = SOLUTIONS.map(s =>
    `ID:${s.id} | ${s.category_label} | ${s.name} | ${s.description}`
  ).join('\n');

  // Системный промпт — задаём роль и формат
  const systemPrompt = `Ты ИИ-консультант по подбору решений для обучения и развития сотрудников.

Каталог доступных решений:
${context}

Правила:
1. Отвечай на русском, дружелюбно и по делу.
2. НИКОГДА не используй markdown — никаких **, *, #, нумерованных списков со звёздочками.
3. Пиши простым текстом. Перечисляй решения по названию, не по ID.
4. В тексте ответа (поле reply) упоминай только название решения, никогда не пиши его ID.
5. Когда пользователь описывает задачу — подбери 2-5 подходящих решений и объясни почему каждое подходит.
6. Когда пользователь задаёт уточняющий вопрос — отвечай на него, опираясь на уже предложенные решения.
7. ВСЕГДА возвращай JSON:
{"reply":"твой ответ с названиями решений","matches":{"id1":"почему подходит","id2":"почему подходит"}}
В matches используй ID как ключи, но в reply пиши только человекочитаемые названия.`;

  // Собираем полную историю для контекста
  const messages = [
    { role: 'system', content: systemPrompt },
    ...chatHistory
  ];

  try {
    const r = await fetch(MISTRAL_API, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${MISTRAL_KEY}`
      },
      body: JSON.stringify({
        model: 'mistral-large-latest',
        response_format: { type: 'json_object' },
        messages
      })
    });

    const json = await r.json();
    const raw = json?.choices?.[0]?.message?.content || '{}';

    let reply = '', matches = {};
    try {
      const obj = JSON.parse(raw);
      reply = obj.reply || '';
      matches = obj.matches || {};
    } catch { reply = raw; }

    removeLoadingMessage();
    addMessage('assistant', reply);

    // Обновляем карточки только если есть новые matches
    if (Object.keys(matches).length > 0) {
      highlightedIds = Object.keys(matches);
      aiNotes = matches;
      const meta = document.getElementById('chat-meta');
      meta.className = 'chat-meta visible';
      document.getElementById('found-badge').textContent = `${highlightedIds.length} решений подобрано`;
      render();
      document.querySelector('.main').scrollIntoView({ behavior: 'smooth' });
    }

  } catch(e) {
    removeLoadingMessage();
    addMessage('assistant', 'Ошибка подключения: ' + e.message);
  }

  btn.disabled = false;
}

function resetAI() {
  highlightedIds = [];
  aiNotes = {};
  chatHistory = [];
  document.getElementById('chat-history').innerHTML = '';
  document.getElementById('chat-meta').className = 'chat-meta';
  document.getElementById('chat-input').value = '';
  render();
}

document.getElementById('chat-input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.ctrlKey) askAI();
});

// ── Детальная карточка ───────────────────────────────────────────
function showDetail(id) {
  const s = SOLUTIONS.find(x => x.id === id);
  if (!s) return;

  document.getElementById('modal-content').innerHTML = `
    <div class="modal-badge"><span class="card-badge badge-${s.category}">${s.category_label}</span></div>
    <div class="modal-title">${s.name}</div>
    ${s.description ? `<div class="modal-row"><div class="modal-key">Описание</div><div class="modal-val">${s.description.replace(/\n/g,'<br>')}</div></div>` : ''}
    <div class="modal-row"><div class="modal-key">Провайдер</div><div class="modal-val">${s.provider}</div></div>
    ${s.effect ? `<div class="modal-row"><div class="modal-key">Эффект</div><div class="modal-val">${s.effect.replace(/\n/g,'<br>')}</div></div>` : ''}
    ${s.date ? `<div class="modal-row"><div class="modal-key">Дата</div><div class="modal-val">${s.date}</div></div>` : ''}
    ${aiNotes[id] ? `<div class="modal-row"><div class="modal-key">Почему подходит</div><div class="modal-val" style="color:var(--accent)">💡 ${aiNotes[id]}</div></div>` : ''}
  `;
  document.getElementById('overlay').className = 'overlay visible';
}

function closeModal(e) {
  if (!e || e.target === document.getElementById('overlay')) {
    document.getElementById('overlay').className = 'overlay';
  }
}

// ── Переключатель темы ───────────────────────────────────────────
function toggleTheme() {
  const isLight = document.body.classList.toggle('light');
  document.getElementById('theme-icon').textContent = isLight ? '🌙' : '☀️';
  document.getElementById('theme-label').textContent = isLight ? 'Тёмная' : 'Светлая';
  localStorage.setItem('theme', isLight ? 'light' : 'dark');
}

// Восстановить тему из localStorage
if (localStorage.getItem('theme') === 'light') {
  document.body.classList.add('light');
  document.getElementById('theme-icon').textContent = '🌙';
  document.getElementById('theme-label').textContent = 'Тёмная';
}
</script>
</body>
</html>
